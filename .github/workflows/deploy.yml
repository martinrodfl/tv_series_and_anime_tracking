name: Publicar en GitHub Pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez. Las que están en curso no se cancelan (una publicación a medias podría dejar el sitio
# a medio actualizar); si llegan varias, solo se conserva la más reciente en espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Solo se publica si el código pasa estas comprobaciones (el build ya ejecuta `tsc -b`).
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Si publica desde `dev`, esa rama debe estar permitida en Settings → Environments → github-pages.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
